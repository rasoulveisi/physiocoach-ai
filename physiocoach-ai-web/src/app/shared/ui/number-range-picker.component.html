<section
  class="grid min-w-0 gap-2 rounded-xl border border-slate-200 bg-white p-2.5 shadow-sm transition-all duration-300 ease-out hover:shadow-md sm:p-3 dark:border-slate-800 dark:bg-slate-900"
  [attr.data-selected-value]="selectedValue()"
  [attr.data-selected-label]="selectedLabel()"
>
  @if (mode() === 'sheet') {
    <button
      type="button"
      class="grid min-w-0 grid-cols-[1fr_auto] items-center gap-2 text-left"
      [attr.aria-controls]="panelId"
      [attr.aria-expanded]="panelOpen()"
      (click)="onRowClick()"
    >
      <div class="min-w-0">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
          {{ label() }}
        </p>
        <p class="truncate text-lg font-semibold text-slate-900 dark:text-slate-50">
          {{ selectedLabel() }}
        </p>
      </div>
      <span
        class="pi pi-chevron-down text-sm text-slate-500 transition-transform duration-200 ease-out dark:text-slate-400"
        [class.rotate-180]="panelOpen()"
        aria-hidden="true"
      ></span>
    </button>
  } @else {
    <label
      class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400"
      [for]="wheelId"
    >
      {{ label() }}
    </label>
  }

  @if (panelOpen()) {
    <section class="grid gap-2" [id]="panelId">
      <div data-layout="desktop-picker" class="hidden lg:block">
        <p-select
          class="w-full"
          styleClass="w-full"
          [inputId]="wheelId + '-desktop'"
          [options]="options()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="selectedValue()"
          [placeholder]="emptyLabel()"
          [scrollHeight]="'240px'"
          [virtualScroll]="options().length > 80"
          [virtualScrollItemSize]="38"
          [appendTo]="'body'"
          (onChange)="onDesktopValueSelect($event.value)"
        />
      </div>

      <div data-layout="mobile-wheel-picker" class="block lg:hidden">
        <div
          class="relative grid min-w-0 touch-none select-none grid-rows-[repeat(5,2.75rem)] overflow-hidden rounded-2xl border border-slate-700/70 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 shadow-2xl shadow-slate-950/20 outline-none transition-all duration-300 ease-out active:scale-[0.99] focus-visible:ring-4 focus-visible:ring-blue-500/30 sm:grid-rows-[repeat(5,3.4rem)] motion-reduce:transition-none"
          data-action="number-wheel"
          role="listbox"
          tabindex="0"
          [id]="wheelId"
          [attr.aria-label]="label()"
          [attr.aria-activedescendant]="wheelId + '-selected'"
          (wheel)="onWheel($event)"
          (keydown)="onKeydown($event)"
          (pointerdown)="onPointerDown($event)"
          (pointermove)="onPointerMove($event)"
          (pointerup)="onPointerEnd()"
          (pointercancel)="onPointerEnd()"
          (pointerleave)="onPointerEnd()"
        >
          <div
            class="pointer-events-none absolute left-3 right-3 top-[5.5rem] h-[2.75rem] rounded-xl border-y border-slate-200/20 bg-slate-800/55 shadow-inner sm:top-[6.8rem] sm:h-[3.4rem]"
            aria-hidden="true"
          ></div>

          @for (slot of visibleSlots(); track slot.offset) {
            <button
              type="button"
              class="relative z-10 min-w-0 border-0 bg-transparent text-center text-xl font-semibold leading-none transition-[color,opacity,transform,filter] duration-200 ease-out sm:text-[1.375rem] motion-reduce:transition-none disabled:cursor-default enabled:cursor-pointer enabled:hover:text-slate-100 {{
                slot.offset === 0
                  ? 'scale-100 text-2xl font-bold text-slate-50 drop-shadow-[0_0_18px_rgba(255,255,255,0.24)] sm:text-[1.7rem]'
                  : slot.offset === -1 || slot.offset === 1
                    ? 'scale-95 text-slate-400/65'
                    : 'scale-90 text-slate-500/30 blur-[0.2px]'
              }}"
              data-action="wheel-option"
              role="option"
              [id]="slot.offset === 0 ? wheelId + '-selected' : null"
              [disabled]="slot.option === null"
              [attr.aria-selected]="slot.offset === 0"
              [attr.data-value]="slot.option?.value"
              [attr.data-empty]="
                slot.option?.value === undefined && slot.option !== null ? true : null
              "
              [attr.data-offset]="slot.offset"
              (click)="onWheelOptionClick(slot)"
            >
              <span>{{ slot.option?.label || ' ' }}</span>
            </button>
          }
        </div>

        @if (confirmHint(); as hint) {
          <p class="text-center text-xs font-medium text-slate-500 dark:text-slate-400">
            {{ hint }}
          </p>
        }
      </div>

      @if (mode() === 'sheet') {
        <button
          pButton
          type="button"
          data-action="done"
          severity="success"
          size="small"
          (click)="onDone()"
        >
          Done
        </button>
      }

      @if (error()) {
        <p class="text-sm text-rose-600 dark:text-rose-300">{{ error() }}</p>
      }

      @if (hint()) {
        <p class="text-xs text-slate-500 dark:text-slate-400">{{ hint() }}</p>
      }
    </section>
  }
</section>
