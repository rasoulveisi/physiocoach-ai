<figure data-exercise-visual class="grid min-w-0 gap-2" [class.h-full]="compact()">
  <div
    class="relative overflow-hidden"
    [class]="stageClasses()"
  >
    @if (loading()) {
      <div data-exercise-visual-loading class="absolute inset-0 grid place-items-center bg-white" aria-label="Loading exercise visual">
        <span class="pc-skeleton h-full w-full rounded-none"></span>
      </div>
    }

    @let currentVisual = visual();
    @if (currentVisual.kind === 'media') {
      <img
        data-exercise-image
        class="h-full w-full object-contain mx-auto"
        [src]="currentVisual.url"
        [alt]="name() ? 'Exercise image: ' + name() : 'Exercise image'"
        loading="lazy"
        referrerpolicy="no-referrer"
        (error)="onImageError()"
        (load)="onImageLoad()"
      />
    } @else {
      <div data-exercise-visual-unavailable class="hidden" aria-hidden="true"></div>
    }
  </div>

  @if (!compact() && attribution()) {
    <figcaption data-exercise-attribution class="text-[0.6875rem] text-muted">
      {{ attribution() }}
    </figcaption>
  }
</figure>
