name = "physiocoach-ai-api"
main = "src/index.ts"
compatibility_date = "2025-05-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "physiocoach-ai-api.otconnect.ir", custom_domain = true }
]

[vars]
APP_ENV = "production"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_REFERER = "https://physiocoach.otconnect.ir"
OPENROUTER_TITLE = "PhysioCoach AI"
WORKOUT_MODEL_PRIMARY = "nvidia/nemotron-3-ultra-550b-a55b:free"
WORKOUT_MODEL_FALLBACKS = "poolside/laguna-s-2.1:free,nvidia/nemotron-3-super-120b-a12b:free,google/gemma-2-9b-it:free,openrouter/auto"
OPENROUTER_TIMEOUT_MS = "180000"
OPENROUTER_MAX_RETRIES = "0"
CORS_ORIGIN = "https://physiocoach.otconnect.ir,http://localhost:4200,http://localhost:8787"

[observability.logs]
enabled = false
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "physiocoach_prod"
database_id = "14b1f6b3-a0c3-400f-9b12-7d50c265eb52"
migrations_dir = "src/db/migrations"
